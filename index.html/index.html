<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Profile System</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --error-color: #ef4444;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .hidden { display: none !important; }

    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      text-align: center;
    }

    .login-box {
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      max-width: 300px;
      width: 100%;
    }

    input[type="password"] {
      width: 80%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 4px;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1.3rem;
      margin: 0;
      color: var(--accent-color);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn:active { opacity: 0.8; }
    
    .status-toast {
      margin-top: 12px;
      padding: 10px;
      background-color: #334155;
      border-radius: 6px;
      color: #38bdf8;
      font-size: 0.9rem;
      text-align: center;
    }

    .profile-item {
      border-bottom: 1px solid #334155;
      padding: 8px 0;
    }
    .profile-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN (UNTUK CHROME) -->
  <div id="login-screen" class="login-container">
    <div class="login-box">
      <div style="font-size: 40px;">🔐</div>
      <h3 style="margin: 8px 0;">Private System</h3>
      <p style="font-size: 0.85rem; color: #94a3b8;">Enter Passcode / PIN</p>
      
      <input type="password" id="pin-input" placeholder="••••" maxlength="10">
      <button class="btn" onclick="checkPassword()">Login</button>
      <p id="error-msg" style="color: var(--error-color); font-size: 0.85rem; margin-top: 8px;" class="hidden">Incorrect PIN!</p>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="app-content" class="app-container hidden">
    <div class="header">
      <h1>✨ Personal Dashboard</h1>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">📋 Profiles List</h3>
      <div id="profiles-container">
        <p style="color: #94a3b8; font-size: 0.9rem;">Loading profiles data...</p>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">⚡ Actions</h3>
      <button class="btn" onclick="triggerAction('ACTION_ADD_PROFILE')">➕ Add Profile</button>
      <button class="btn" style="background-color: #cbd5e1; margin-top: 8px;" onclick="loadProfiles()">🔄 Refresh Data</button>
      <button class="btn" style="background-color: #ef4444; color: white; margin-top: 16px;" onclick="logout()">🚪 Logout</button>
      
      <div id="status-toast" class="status-toast hidden"></div>
    </div>
  </div>

  <script>
    const MY_PASSWORD = "1234"; // ⚠️ Tukar PIN korang di sini

    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    if (tg && tg.initDataUnsafe?.user) {
      showApp();
    } else if (localStorage.getItem("is_logged_in") === "true") {
      showApp();
    }

    function checkPassword() {
      const input = document.getElementById("pin-input").value;
      if (input === MY_PASSWORD) {
        localStorage.setItem("is_logged_in", "true");
        showApp();
      } else {
        document.getElementById("error-msg").classList.remove("hidden");
      }
    }

    function showApp() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-content").classList.remove("hidden");
      loadProfiles();
    }

    function loadProfiles() {
      fetch('profiles.json')
        .then(response => {
          if (!response.ok) throw new Error("No data file found");
          return response.json();
        })
        .then(data => {
          const container = document.getElementById('profiles-container');
          container.innerHTML = '';
          
          if (Object.keys(data).length === 0) {
            container.innerHTML = '<p style="color: #94a3b8;">No profiles available.</p>';
            return;
          }

          for (const [key, profile] of Object.entries(data)) {
            const item = document.createElement('div');
            item.className = 'profile-item';
            item.innerHTML = `<strong>${key}</strong><br><small style="color:#94a3b8;">Tarikh Lahir: ${profile.dob || 'N/A'} | Nota: ${profile.notes || '-'}</small>`;
            container.appendChild(item);
          }
        })
        .catch(err => {
          document.getElementById('profiles-container').innerHTML = '<p style="color: #94a3b8;">Tiada data profiles.json lagi di GitHub.</p>';
        });
    }

    function triggerAction(actionText) {
      if (tg && tg.initData) {
        tg.sendData(actionText);
        showToast(`Command sent to bot!`);
      } else {
        showToast(`Action triggered`);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("status-toast");
      toast.innerText = msg;
      toast.classList.remove("hidden");
      setTimeout(() => { toast.classList.add("hidden"); }, 3000);
    }

    function logout() {
      localStorage.removeItem("is_logged_in");
      location.reload();
    }
  </script>
</body>
</html>
